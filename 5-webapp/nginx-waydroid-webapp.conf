# Unified single-port gateway for the webapp + noVNC, installed by
# install-webapp.sh (WEBAPP_UNIFY_VNC=yes, the default). Placeholders
# (__LISTEN__, __GUNICORN_PORT__) are filled in by that script - see it
# for how the listen address is resolved (WEBAPP_EXPOSE_LAN) and why
# gunicorn/novnc always bind 127.0.0.1 once this is in place.
server {
    listen __LISTEN__;

    # Flask webapp (GPS control, favorites, and anything added later) -
    # everything not explicitly routed to noVNC below.
    location / {
        proxy_pass http://127.0.0.1:__GUNICORN_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # noVNC's websocket endpoint. Confirmed against a real browser
    # session (nginx access log) rather than source reading alone: when
    # vnc.html is loaded from /vnc/vnc.html, the page's own JS requests
    # its websocket at /vnc/websockify - relative to the directory it was
    # itself loaded from, not the root-absolute /websockify an earlier
    # reading of app/ui.js suggested. This location has to sit at
    # /vnc/websockify specifically (nginx picks the longest matching
    # literal prefix, so this wins over the plain /vnc/ location below
    # for this one path) and carry the Upgrade/Connection headers the
    # generic /vnc/ location below does not - without them nginx forwards
    # the request as an ordinary GET, which websockify's static file
    # server then 404s (no file named "websockify" exists in its web
    # root). websockify itself doesn't care what path an upgrade arrives
    # on - it proxies any of them to the fixed target it was started
    # with, 127.0.0.1:5900/wayvnc - matching this path is purely about
    # matching what the BROWSER actually requests.
    location /vnc/websockify {
        proxy_pass http://127.0.0.1:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # VNC sessions can sit idle a long time
        proxy_buffering off;
    }

    # noVNC's static UI (vnc.html, app/, core/, vendor/...), served by
    # websockify's own --web=/usr/share/novnc/ file server. The /vnc/
    # prefix is stripped before forwarding (proxy_pass ends in /), so a
    # request for /vnc/vnc.html reaches websockify as /vnc.html and
    # resolves to a real file. Everything under /vnc/ that isn't the
    # websocket path above (assets, vnc.html itself) lands here.
    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_set_header Host $host;
    }
}
