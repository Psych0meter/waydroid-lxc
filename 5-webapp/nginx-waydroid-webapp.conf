# Unified single-port gateway for the webapp + noVNC, installed by
# install-webapp.sh (WEBAPP_UNIFY_VNC=yes, the default). Placeholders
# (__LISTEN__, __GUNICORN_PORT__) are filled in by that script - see it
# for how the listen address is resolved (WEBAPP_EXPOSE_LAN) and why
# gunicorn/novnc always bind 127.0.0.1 once this is in place.
server {
    listen __LISTEN__;

    # Flask webapp (GPS control, favorites, and anything added later) -
    # everything not explicitly routed to noVNC below.
    location / {
        proxy_pass http://127.0.0.1:__GUNICORN_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # noVNC's static UI (vnc.html, app/, core/, vendor/...), served by
    # websockify's own --web=/usr/share/novnc/ file server. The /vnc/
    # prefix is stripped before forwarding (proxy_pass ends in /), so a
    # request for /vnc/vnc.html reaches websockify as /vnc.html and
    # resolves to a real file.
    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_set_header Host $host;
    }

    # noVNC's websocket endpoint. Verified against the actual installed
    # noVNC package source (app/ui.js): UI.initSetting('path',
    # 'websockify') plus its connect() building
    # 'ws://' + host + ':' + port + '/' + path means the browser ALWAYS
    # connects to ws(s)://<this proxy's own host:port>/websockify - an
    # absolute root path, not something relative to wherever vnc.html
    # was itself served from - so this has to be its own top-level
    # location matching that hardcoded default exactly, not nested under
    # /vnc/. websockify itself doesn't care what path an upgrade request
    # arrives on (it proxies any of them to the fixed target it was
    # started with, 127.0.0.1:5900/wayvnc) - this location exists to
    # match the BROWSER's expectation, not a requirement of websockify.
    location /websockify {
        proxy_pass http://127.0.0.1:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # VNC sessions can sit idle a long time
        proxy_buffering off;
    }
}
